name: Build and publish ADM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import sys, numpy, pandas, PyInstaller; print(sys.version); print('numpy', numpy.__version__); print('pandas', pandas.__version__); print('PyInstaller', PyInstaller.__version__)"

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = python -c "from core.app_info import APP_VERSION; print(APP_VERSION)"
          if ($tagVersion -ne $appVersion) {
            throw "El tag $tagVersion no coincide con APP_VERSION=$appVersion"
          }

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm ADM.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $healthFile = Join-Path $env:RUNNER_TEMP "adm-startup-ok.txt"
          Remove-Item -LiteralPath $healthFile -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath (Resolve-Path "dist/ADM.exe") `
            -ArgumentList @("--update-health-file", $healthFile) `
            -PassThru
          $started = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path -LiteralPath $healthFile) {
              $started = $true
              break
            }
            $process.Refresh()
            if ($process.HasExited) {
              break
            }
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $started) {
            throw "El ADM.exe empaquetado no confirmó que pudo iniciar."
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ADM.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ADM.exe" | Set-Content dist/ADM.exe.sha256 -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/ADM.exe `
            dist/ADM.exe.sha256 `
            --title "ADM ${{ github.ref_name }}" `
            --generate-notes
